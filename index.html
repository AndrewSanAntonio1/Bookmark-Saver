<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark saver</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Bookmark Saver</h1>
        <form action="">
            <input type="text" placeholder="Bookmark Name" required class="js-name-input"> <br>
            <input type="text" placeholder="Bookmark URL" required class="js-url-input"> <br>
            <button type="button" class="js-bookmark-button bookmark-button">Add Bookmark</button> <br>
        </form>
        <div class="display"></div>
    </div>
    <script src="index.js"></script>
</body>
</html>
